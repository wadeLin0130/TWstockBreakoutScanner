<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股強勢突破即時監控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans min-h-screen transition-colors duration-200">
    <div id="app" class="max-w-7xl mx-auto p-4 md:p-8">
        
        <!-- Header -->
        <header class="mb-6 flex flex-col md:flex-row justify-between items-end gap-4 border-b border-gray-300 dark:border-gray-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100 tracking-wide flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                    台股強勢突破即時監控
                </h1>
                <p class="text-gray-500 dark:text-gray-400 mt-1 text-sm">盤中半即時串流</p>
            </div>
            <div class="text-right">
                <div class="flex items-center justify-end gap-3 mb-2">
                    <button @click="toggleDarkMode" class="text-sm font-medium bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 px-3 py-1 rounded transition flex items-center shadow-sm">
                        {{ isDarkMode ? '切換明亮模式' : '切換深色模式' }}
                    </button>
                    <div class="text-sm font-medium bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-3 py-1 rounded inline-flex items-center gap-2">
                        <span>最後更新: {{ lastUpdate }}</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Loading State -->
        <div v-if="loading" class="text-center py-20">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500 mx-auto"></div>
            <p class="mt-4 text-gray-500 dark:text-gray-400 text-sm">正在與 Firebase 建立即時連線...</p>
        </div>

        <!-- Main Workspace -->
        <div v-else-if="stocks.length > 0">
            
            <!-- 進階篩選列 -->
            <div class="mb-6 bg-white dark:bg-gray-800 p-5 rounded shadow-sm border border-gray-200 dark:border-gray-700">
                <div class="flex flex-col lg:flex-row justify-between lg:items-center mb-4 border-b border-gray-100 dark:border-gray-700 pb-3 gap-3">
                    <div class="text-sm font-bold text-gray-700 dark:text-gray-300">進階條件篩選</div>
                    <div class="flex flex-wrap gap-2">
                        <button @click="applyQuickFilter('pending')" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 rounded transition font-medium">強勢即將突破</button>
                        <button @click="applyQuickFilter('just_breakout')" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 rounded transition font-medium">強勢剛突破</button>
                        <button @click="applyQuickFilter('continuous')" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 rounded transition font-medium">持續突破</button>
                        <button @click="applyQuickFilter('consolidation')" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 rounded transition font-medium">高檔整理突破</button>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col">
                        <label class="text-xs text-gray-500 dark:text-gray-400 mb-1">已突破幅度 (%)</label>
                        <div class="flex items-center space-x-1">
                            <input type="number" v-model="filter.breakoutMin" placeholder="Min" class="w-full p-1.5 text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded focus:outline-none">
                            <span class="text-gray-400">-</span>
                            <input type="number" v-model="filter.breakoutMax" placeholder="Max" class="w-full p-1.5 text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded focus:outline-none">
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs text-gray-500 dark:text-gray-400 mb-1">距前高幅度 (%)</label>
                        <div class="flex items-center space-x-1">
                            <input type="number" v-model="filter.distanceMin" placeholder="Min" class="w-full p-1.5 text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded focus:outline-none">
                            <span class="text-gray-400">-</span>
                            <input type="number" v-model="filter.distanceMax" placeholder="Max" class="w-full p-1.5 text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded focus:outline-none">
                        </div>
                    </div>
                </div>

                <div class="mt-4 border-t border-gray-100 dark:border-gray-700 pt-3">
                    <button @click="showReturnFilters = !showReturnFilters" class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 transition">
                        {{ showReturnFilters ? '收合各期間漲幅篩選 ▲' : '展開各期間漲幅篩選 ▼' }}
                    </button>
                    
                    <div v-show="showReturnFilters" class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-4 bg-gray-50 dark:bg-gray-700/30 p-3 rounded border border-gray-100 dark:border-gray-700">
                        <div class="flex flex-col">
                            <label class="text-xs text-gray-500 dark:text-gray-400 mb-1">當日漲幅 (%)</label>
                            <div class="flex items-center space-x-1">
                                <input type="number" v-model="filter.todayReturnMin" placeholder="Min" class="w-full p-1.5 text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded focus:outline-none">
                                <span class="text-gray-400">-</span>
                                <input type="number" v-model="filter.todayReturnMax" placeholder="Max" class="w-full p-1.5 text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded focus:outline-none">
                            </div>
                        </div>
                        <div class="flex flex-col">
                            <label class="text-xs text-gray-500 dark:text-gray-400 mb-1">近 5 日漲幅 (%)</label>
                            <div class="flex items-center space-x-1">
                                <input type="number" v-model="filter.returnMin" placeholder="Min" class="w-full p-1.5 text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded focus:outline-none">
                                <span class="text-gray-400">-</span>
                                <input type="number" v-model="filter.returnMax" placeholder="Max" class="w-full p-1.5 text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded focus:outline-none">
                            </div>
                        </div>
                        <div class="flex flex-col">
                            <label class="text-xs text-gray-500 dark:text-gray-400 mb-1">近 10 日漲幅 (%)</label>
                            <div class="flex items-center space-x-1">
                                <input type="number" v-model="filter.return10dMin" placeholder="Min" class="w-full p-1.5 text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded focus:outline-none">
                                <span class="text-gray-400">-</span>
                                <input type="number" v-model="filter.return10dMax" placeholder="Max" class="w-full p-1.5 text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded focus:outline-none">
                            </div>
                        </div>
                        <div class="flex flex-col">
                            <label class="text-xs text-gray-500 dark:text-gray-400 mb-1">近 20 日漲幅 (%)</label>
                            <div class="flex items-center space-x-1">
                                <input type="number" v-model="filter.return20dMin" placeholder="Min" class="w-full p-1.5 text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded focus:outline-none">
                                <span class="text-gray-400">-</span>
                                <input type="number" v-model="filter.return20dMax" placeholder="Max" class="w-full p-1.5 text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded focus:outline-none">
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4 flex justify-end">
                    <button @click="resetFilters" class="text-sm px-4 py-1.5 border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 rounded hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                        重設條件
                    </button>
                </div>
            </div>

            <!-- Main Table -->
            <div class="bg-white dark:bg-gray-800 rounded shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                <div class="p-4 bg-gray-50 dark:bg-gray-700 border-b border-gray-200 dark:border-gray-600 flex justify-between items-center">
                    <span class="font-bold text-gray-700 dark:text-gray-200 text-sm">符合條件共 {{ filteredStocks.length }} 檔標的</span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse whitespace-nowrap text-sm">
                        <thead class="bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 border-b border-gray-200 dark:border-gray-700">
                            <tr>
                                <th class="p-3">
                                    <div class="flex items-center gap-1">
                                        <span class="cursor-pointer hover:text-gray-900 dark:hover:text-white" @click="setSort('Industry')">產業</span>/
                                        <span class="cursor-pointer hover:text-gray-900 dark:hover:text-white font-bold" @click="setSort('Symbol')">標的</span>
                                    </div>
                                </th>
                                <th class="p-3 text-right">
                                    <div class="flex flex-col items-end">
                                        <div class="cursor-pointer hover:text-gray-900 dark:hover:text-white font-bold" @click="setSort('Latest_Price')">即時現價 <span class="w-2 h-2 inline-block rounded-full bg-red-500 animate-pulse"></span></div>
                                        <div class="cursor-pointer hover:text-gray-900 dark:hover:text-white text-xs font-normal" @click="setSort('Max_High')">52週前高</div>
                                    </div>
                                </th>
                                <th class="p-3 text-right hidden sm:table-cell">
                                    <div class="flex flex-col items-end gap-1">
                                        <div class="text-xs font-normal text-gray-500">
                                            <span class="cursor-pointer hover:text-gray-900 dark:hover:text-white" @click="setSort('Today_Return')">當日</span> |
                                            <span class="cursor-pointer hover:text-gray-900 dark:hover:text-white font-bold" @click="setSort('Return_5D')">5日</span>
                                        </div>
                                        <div class="text-xs font-normal text-gray-500">
                                            <span class="cursor-pointer hover:text-gray-900 dark:hover:text-white" @click="setSort('Return_10D')">10日</span> |
                                            <span class="cursor-pointer hover:text-gray-900 dark:hover:text-white" @click="setSort('Return_20D')">20日</span>
                                        </div>
                                    </div>
                                </th>
                                <th class="p-3 text-right">
                                    <div class="flex flex-col items-end gap-1">
                                        <div class="text-xs font-normal">
                                            <span class="cursor-pointer hover:text-gray-900 dark:hover:text-white" @click="setSort('Breakout_Margin')">已突破%</span> / 
                                            <span class="cursor-pointer hover:text-gray-900 dark:hover:text-white" @click="setSort('Distance_To_High')">距前高%</span>
                                        </div>
                                    </div>
                                </th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
                            <template v-for="stock in paginatedStocks" :key="stock.Symbol">
                                <!-- 列點擊展開圖表 -->
                                <tr @click="toggleRow(stock.Symbol)" class="hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition">
                                    <td class="p-3">
                                        <div class="text-xs text-gray-500 dark:text-gray-400 mb-0.5">{{ stock.Industry }}</div>
                                        <div class="font-bold text-blue-600 dark:text-blue-400">{{ stock.Symbol }} {{ stock.Name }}</div>
                                    </td>
                                    <td class="p-3 text-right">
                                        <div class="font-bold text-gray-900 dark:text-gray-100 text-lg mb-0.5">{{ stock.Latest_Price }}</div>
                                        <div class="text-xs text-gray-500 dark:text-gray-400">{{ stock.Max_High }}</div>
                                    </td>
                                    <td class="p-3 text-right hidden sm:table-cell">
                                        <div class="text-xs mb-1">
                                            <span class="text-gray-500 dark:text-gray-400">當日: </span><span :class="stock.Today_Return >= 0 ? 'text-red-600 dark:text-red-400' : 'text-green-600 dark:text-green-400'" class="font-medium inline-block w-12">{{ stock.Today_Return > 0 ? '+' : '' }}{{ stock.Today_Return }}%</span> <span class="text-gray-300 dark:text-gray-600">|</span> 
                                            <span class="text-gray-500 dark:text-gray-400">5日: </span><span :class="stock.Return_5D >= 0 ? 'text-red-600 dark:text-red-400' : 'text-green-600 dark:text-green-400'" class="font-bold inline-block w-12">{{ stock.Return_5D > 0 ? '+' : '' }}{{ stock.Return_5D }}%</span>
                                        </div>
                                        <div class="text-xs">
                                            <span class="text-gray-500 dark:text-gray-400">10日: </span><span :class="stock.Return_10D >= 0 ? 'text-red-600 dark:text-red-400' : 'text-green-600 dark:text-green-400'" class="font-medium inline-block w-12">{{ stock.Return_10D > 0 ? '+' : '' }}{{ stock.Return_10D }}%</span> <span class="text-gray-300 dark:text-gray-600">|</span> 
                                            <span class="text-gray-500 dark:text-gray-400">20日: </span><span :class="stock.Return_20D >= 0 ? 'text-red-600 dark:text-red-400' : 'text-green-600 dark:text-green-400'" class="font-medium inline-block w-12">{{ stock.Return_20D > 0 ? '+' : '' }}{{ stock.Return_20D }}%</span>
                                        </div>
                                    </td>
                                    <td class="p-3 text-right">
                                        <div class="text-xs mt-2">
                                            <span v-if="stock.Breakout_Margin !== null && stock.Breakout_Margin !== ''" class="font-bold text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30 px-1 py-0.5 rounded">突破 +{{ stock.Breakout_Margin }}%</span>
                                            <span v-else-if="stock.Distance_To_High !== null && stock.Distance_To_High !== ''" class="font-medium text-gray-500 dark:text-gray-400">距離 {{ stock.Distance_To_High }}%</span>
                                        </div>
                                    </td>
                                </tr>
                                
                                <!-- 展開區塊 (包含 AI 介紹、狀態與圖表) -->
                                <tr v-if="expandedRow === stock.Symbol" class="bg-gray-50 dark:bg-gray-800 shadow-inner">
                                    <td colspan="4" class="p-4 md:p-6 border-b-2 border-gray-300 dark:border-gray-600">
                                        
                                        <!-- AI 介紹與狀態列 -->
                                        <div class="mb-4 flex flex-col md:flex-row gap-4">
                                            <div class="flex-1 bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800 p-3 rounded">
                                                <div class="text-xs font-bold text-blue-800 dark:text-blue-300 mb-1">企業簡介</div>
                                                <div class="text-sm text-blue-900 dark:text-blue-100">{{ stock.Company_Info || '分析生成中...' }}</div>
                                            </div>
                                            <div class="md:w-1/3 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 p-3 rounded">
                                                <div class="text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">籌碼與評級</div>
                                                <div class="text-sm text-gray-800 dark:text-gray-200 mb-1">{{ stock.Status_Tags }}</div>
                                                <div v-if="stock.Rating" class="text-xs font-bold text-purple-600 dark:text-purple-400">{{ stock.Rating }}</div>
                                            </div>
                                        </div>

                                        <div class="flex justify-between items-center mb-4">
                                            <h4 class="font-bold text-gray-800 dark:text-gray-200">近 60 日技術線圖 (可左右滑動/縮放)</h4>
                                            <button @click.stop="toggleRow(stock.Symbol)" class="text-sm text-gray-500 hover:text-gray-800 dark:hover:text-white font-medium border border-gray-300 dark:border-gray-600 px-3 py-1 rounded bg-white dark:bg-gray-700 shadow-sm">關閉區塊</button>
                                        </div>
                                        <div :id="'chart-' + stock.Symbol" style="width: 100%; height: 420px;" class="bg-white dark:bg-gray-900 rounded border border-gray-200 dark:border-gray-700 p-2"></div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div class="bg-gray-50 dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 p-4 flex items-center justify-between">
                    <span class="text-sm text-gray-600 dark:text-gray-400">
                        共 {{ filteredStocks.length }} 筆資料 | 頁次 {{ currentPage }} / {{ totalPages || 1 }}
                    </span>
                    <div class="flex gap-2">
                        <button @click="currentPage--" :disabled="currentPage === 1" class="px-3 py-1 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded disabled:opacity-50 text-sm">上一頁</button>
                        <button @click="currentPage++" :disabled="currentPage >= totalPages" class="px-3 py-1 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded disabled:opacity-50 text-sm">下一頁</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 載入 Firebase 模組 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const { createApp, ref, computed, nextTick, onMounted, watch } = Vue;

        const firebaseConfig = {
            apiKey: "AIzaSyApgtjxY6TTOzQQN4spjPSTfyEX5LFa6ow",
            authDomain: "twsebs-ba9bb.firebaseapp.com",
            projectId: "twsebs-ba9bb",
            storageBucket: "twsebs-ba9bb.firebasestorage.app",
            messagingSenderId: "314951416631",
            appId: "1:314951416631:web:7dfceb19832bcabed978b2",
            measurementId: "G-G2N040LC45"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        createApp({
            setup() {
                const stocks = ref([]);
                const lastUpdate = ref('-');
                const loading = ref(true);
                const expandedRow = ref(null);
                
                const showReturnFilters = ref(false);
                const isDarkMode = ref(false);
                const currentPage = ref(1);
                const itemsPerPage = 10;
                
                const filter = ref({
                    todayReturnMin: null, todayReturnMax: null,
                    returnMin: null, returnMax: null,
                    return10dMin: null, return10dMax: null,
                    return20dMin: null, return20dMax: null,
                    breakoutMin: null, breakoutMax: null,
                    distanceMin: null, distanceMax: null
                });

                const sortKey = ref('Distance_To_High');
                const sortAsc = ref(true); 

                const toggleDarkMode = () => {
                    isDarkMode.value = !isDarkMode.value;
                    if (isDarkMode.value) document.documentElement.classList.add('dark');
                    else document.documentElement.classList.remove('dark');
                    if (expandedRow.value) renderChart(expandedRow.value);
                };

                onMounted(() => {
                    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        isDarkMode.value = true;
                        document.documentElement.classList.add('dark');
                    }

                    onSnapshot(collection(db, "LiveStocks"), (snapshot) => {
                        const newStocks = [];
                        snapshot.forEach((doc) => {
                            newStocks.push(doc.data());
                        });
                        
                        stocks.value = newStocks;
                        const now = new Date();
                        lastUpdate.value = now.getHours().toString().padStart(2, '0') + ':' + 
                                           now.getMinutes().toString().padStart(2, '0') + ':' + 
                                           now.getSeconds().toString().padStart(2, '0');
                        loading.value = false;
                    }, (error) => {
                        console.error("Firebase 連線錯誤:", error);
                        alert("資料庫連線失敗，請檢查 Config 是否正確。");
                    });
                });

                const resetFilters = () => {
                    filter.value = { todayReturnMin: null, todayReturnMax: null, returnMin: null, returnMax: null, return10dMin: null, return10dMax: null, return20dMin: null, return20dMax: null, breakoutMin: null, breakoutMax: null, distanceMin: null, distanceMax: null };
                    currentPage.value = 1;
                };

                const applyQuickFilter = (type) => {
                    resetFilters();
                    if (type === 'pending') { filter.value.returnMin = 10; filter.value.distanceMax = 5; } 
                    else if (type === 'just_breakout') { filter.value.returnMin = 10; filter.value.breakoutMin = 2; } 
                    else if (type === 'continuous') { filter.value.returnMin = 10; filter.value.breakoutMin = 0; } 
                    else if (type === 'consolidation') { filter.value.breakoutMin = 0; filter.value.return20dMin = 10; }
                };

                const filteredStocks = computed(() => {
                    return stocks.value.filter(stock => {
                        const f = filter.value;
                        if (f.todayReturnMin !== null && f.todayReturnMin !== '' && stock.Today_Return < parseFloat(f.todayReturnMin)) return false;
                        if (f.todayReturnMax !== null && f.todayReturnMax !== '' && stock.Today_Return > parseFloat(f.todayReturnMax)) return false;
                        if (f.returnMin !== null && f.returnMin !== '' && stock.Return_5D < parseFloat(f.returnMin)) return false;
                        if (f.returnMax !== null && f.returnMax !== '' && stock.Return_5D > parseFloat(f.returnMax)) return false;
                        if (f.return10dMin !== null && f.return10dMin !== '' && stock.Return_10D < parseFloat(f.return10dMin)) return false;
                        if (f.return10dMax !== null && f.return10dMax !== '' && stock.Return_10D > parseFloat(f.return10dMax)) return false;
                        if (f.return20dMin !== null && f.return20dMin !== '' && stock.Return_20D < parseFloat(f.return20dMin)) return false;
                        if (f.return20dMax !== null && f.return20dMax !== '' && stock.Return_20D > parseFloat(f.return20dMax)) return false;
                        
                        const isBreakoutSet = (f.breakoutMin !== null && f.breakoutMin !== '') || (f.breakoutMax !== null && f.breakoutMax !== '');
                        if (isBreakoutSet) {
                            if (stock.Breakout_Margin === null || stock.Breakout_Margin === '') return false;
                            if (f.breakoutMin !== null && f.breakoutMin !== '' && stock.Breakout_Margin < parseFloat(f.breakoutMin)) return false;
                            if (f.breakoutMax !== null && f.breakoutMax !== '' && stock.Breakout_Margin > parseFloat(f.breakoutMax)) return false;
                        }

                        const isDistanceSet = (f.distanceMin !== null && f.distanceMin !== '') || (f.distanceMax !== null && f.distanceMax !== '');
                        if (isDistanceSet) {
                            if (stock.Distance_To_High === null || stock.Distance_To_High === '') return false;
                            if (f.distanceMin !== null && f.distanceMin !== '' && stock.Distance_To_High < parseFloat(f.distanceMin)) return false;
                            if (f.distanceMax !== null && f.distanceMax !== '' && stock.Distance_To_High > parseFloat(f.distanceMax)) return false;
                        }
                        return true;
                    });
                });

                watch(filteredStocks, () => { currentPage.value = 1; });

                const sortedStocks = computed(() => {
                    return [...filteredStocks.value].sort((a, b) => {
                        let valA = a[sortKey.value];
                        let valB = b[sortKey.value];
                        if (valA === null || valA === '') valA = sortAsc.value ? Infinity : -Infinity;
                        if (valB === null || valB === '') valB = sortAsc.value ? Infinity : -Infinity;
                        if (valA === valB) return 0;
                        let comp = valA > valB ? 1 : -1;
                        return sortAsc.value ? comp : -comp;
                    });
                });

                const totalPages = computed(() => Math.ceil(sortedStocks.value.length / itemsPerPage));
                const paginatedStocks = computed(() => {
                    const start = (currentPage.value - 1) * itemsPerPage;
                    return sortedStocks.value.slice(start, start + itemsPerPage);
                });

                const setSort = (key) => {
                    if (sortKey.value === key) sortAsc.value = !sortAsc.value;
                    else { sortKey.value = key; sortAsc.value = false; }
                };

                const toggleRow = (symbol) => {
                    if (expandedRow.value === symbol) { expandedRow.value = null; } 
                    else { expandedRow.value = symbol; nextTick(() => { renderChart(symbol); }); }
                };

                const renderChart = (symbol) => {
                    const stock = stocks.value.find(s => s.Symbol === symbol);
                    if (!stock || !stock.Klines) return;
                    
                    const klines = JSON.parse(stock.Klines);
                    const chartDom = document.getElementById('chart-' + symbol);
                    let myChart = echarts.getInstanceByDom(chartDom);
                    if (myChart) myChart.dispose();
                    myChart = echarts.init(chartDom, isDarkMode.value ? 'dark' : null);
                    
                    const categoryData = klines.map(k => k.date);
                    const values = klines.map(k => [k.open, k.close, k.low, k.high]);
                    const volumes = klines.map(k => {
                        const isUp = k.close >= k.open;
                        return { value: k.volume, itemStyle: { color: isUp ? '#dc2626' : '#16a34a' } };
                    });

                    const markLineData = [];
                    const len = categoryData.length;

                    if (stock.Max_High) markLineData.push({ yAxis: stock.Max_High, lineStyle: { color: '#dc2626', width: 2, type: 'dashed', opacity: 0.8 }, label: { formatter: '前高 {c}', position: 'insideEndTop', color: '#dc2626', fontWeight: 'bold' } });
                    if (stock.MA5) markLineData.push([ { coord: [categoryData[Math.max(0, len - 5)], stock.MA5], symbol: 'none', lineStyle: { color: '#3b82f6', width: 2, type: 'dashed', opacity: 0.6 } }, { coord: [categoryData[len - 1], stock.MA5], symbol: 'none', label: { formatter: '5MA', position: 'end', color: '#3b82f6', fontWeight: 'bold' } } ]);
                    if (stock.MA10) markLineData.push([ { coord: [categoryData[Math.max(0, len - 10)], stock.MA10], symbol: 'none', lineStyle: { color: '#d97706', width: 2, type: 'dashed', opacity: 0.6 } }, { coord: [categoryData[len - 1], stock.MA10], symbol: 'none', label: { formatter: '10MA', position: 'end', color: '#d97706', fontWeight: 'bold' } } ]);
                    if (stock.MA20) markLineData.push([ { coord: [categoryData[0], stock.MA20], symbol: 'none', lineStyle: { color: '#7c3aed', width: 2, type: 'dashed', opacity: 0.6 } }, { coord: [categoryData[len - 1], stock.MA20], symbol: 'none', label: { formatter: '20MA', position: 'end', color: '#7c3aed', fontWeight: 'bold' } } ]);

                    const option = {
                        backgroundColor: 'transparent',
                        tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                        axisPointer: { link: { xAxisIndex: 'all' } },
                        grid: [ 
                            { left: '6%', right: '6%', top: '8%', height: '55%' }, 
                            { left: '6%', right: '6%', top: '70%', height: '15%' } 
                        ],
                        xAxis: [ 
                            { type: 'category', data: categoryData, boundaryGap: false, axisLine: { onZero: false }, splitLine: { show: false }, min: 'dataMin', max: 'dataMax' }, 
                            { type: 'category', gridIndex: 1, data: categoryData, boundaryGap: false, axisLine: { onZero: false }, axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false }, min: 'dataMin', max: 'dataMax' } 
                        ],
                        yAxis: [ 
                            { scale: true, splitArea: { show: true } }, 
                            { scale: true, gridIndex: 1, splitNumber: 2, axisLabel: { show: false }, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } } 
                        ],
                        dataZoom: [
                            {
                                type: 'inside',
                                xAxisIndex: [0, 1],
                                startValue: Math.max(0, categoryData.length - 20),
                                endValue: categoryData.length - 1
                            },
                            {
                                show: true,
                                type: 'slider',
                                xAxisIndex: [0, 1],
                                top: '90%',
                                startValue: Math.max(0, categoryData.length - 20),
                                endValue: categoryData.length - 1
                            }
                        ],
                        series: [ 
                            { name: 'K線', type: 'candlestick', data: values, itemStyle: { color: '#dc2626', color0: '#16a34a', borderColor: '#dc2626', borderColor0: '#16a34a' }, markLine: { data: markLineData, animation: false } }, 
                            { name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: volumes } 
                        ]
                    };
                    myChart.setOption(option);
                    window.addEventListener('resize', () => myChart.resize());
                };

                return {
                    stocks, lastUpdate, loading, expandedRow,
                    filter, filteredStocks, applyQuickFilter,
                    sortKey, sortAsc, sortedStocks, paginatedStocks, setSort, resetFilters,
                    toggleRow, showReturnFilters, isDarkMode, toggleDarkMode,
                    currentPage, totalPages
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
